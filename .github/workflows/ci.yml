name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    name: fmt, clippy, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: API docs build without broken links
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      # `cargo test` regenerates the dashboard's protocol types.
      - name: Generated TypeScript is up to date
        run: |
          if [ -n "$(git status --porcelain web/src/api/generated)" ]; then
            git status --short web/src/api/generated
            echo "::error::Protocol types changed. Run cargo test and commit web/src/api/generated."
            exit 1
          fi

  web:
    name: dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  cuda:
    name: CUDA backend (no GPU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      # cudarc's fallback-latest feature lets the crate build without a CUDA toolkit.
      - name: Clippy with --features cuda
        run: |
          cargo clippy -p paged-kv-cuda --features cuda --all-targets -- -D warnings
          cargo clippy -p paged-kv-model --features cuda --all-targets -- -D warnings
          cargo clippy -p paged-kv-py --features cuda --all-targets -- -D warnings
          cargo clippy -p paged-kv-serve --features cuda --all-targets -- -D warnings

      # NVRTC compiles the kernels without a GPU; cudarc loads it with dlopen.
      - name: Install NVRTC
        run: |
          python3 -m venv /tmp/nvrtc
          /tmp/nvrtc/bin/pip install --quiet nvidia-cuda-nvrtc-cu12
          lib=$(echo /tmp/nvrtc/lib/python3*/site-packages/nvidia/cuda_nvrtc/lib)
          ln -sf libnvrtc.so.12 "$lib/libnvrtc.so"
          echo "LD_LIBRARY_PATH=$lib" >> "$GITHUB_ENV"

      # The oracle-comparison tests need a real GPU, so only this one runs.
      - name: Compile kernels with NVRTC
        run: cargo test -p paged-kv-cuda --features cuda kernels_compile_with_nvrtc

  python:
    name: Python bindings vs. transformers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyTorch (CPU), transformers and the package
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet maturin pytest numpy safetensors transformers
          maturin develop --release -m crates/paged-kv-py/Cargo.toml
      - name: Test against transformers
        run: .venv/bin/python -m pytest crates/paged-kv-py/tests -v

  benchmark:
    name: Benchmark smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet -r bench/requirements.txt
      # A tiny model, so this checks behaviour (no failed requests, batching,
      # prefix caching) rather than timings, which vary between runners.
      - name: Load test the server
        run: QUICK=1 OUT=bench-results bench/run_benchmark.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-smoke
          path: bench-results

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: paged-kv-demo:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Serves the dashboard and health check
        run: |
          docker run -d --name demo -p 8080:8080 paged-kv-demo:ci
          for i in $(seq 1 30); do curl -sf localhost:8080/api/health && break; sleep 1; done
          curl -sf localhost:8080/ | grep -q '<div id="root">'
          docker stop demo
