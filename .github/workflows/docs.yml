name: API docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # cudarc's fallback-latest feature lets the CUDA crate document without a toolkit.
      - name: Build docs
        run: cargo doc --no-deps -p paged-kv-core -p paged-kv-model -p paged-kv-cuda --features paged-kv-cuda/cuda
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Land on the core crate
        run: echo '<meta http-equiv="refresh" content="0; url=paged_kv_core/index.html">' > target/doc/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: target/doc

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
