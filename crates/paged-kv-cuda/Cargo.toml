[package]
name = "paged-kv-cuda"
description = "CUDA backend for paged-kv-core: reshape_and_cache, copy_blocks, zero_block, paged_attention."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# Off by default so the workspace builds and tests without a CUDA toolkit.
default = []
cuda = ["dep:cudarc"]

[dependencies]
paged-kv-core = { workspace = true }
# Detects the installed CUDA version, falling back to recent bindings when no
# toolkit is present. Libraries are loaded at runtime, so none are needed to build.
cudarc = { version = "0.19", optional = true, features = ["cuda-version-from-build-system", "fallback-latest"] }
