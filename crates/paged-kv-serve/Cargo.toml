[package]
name = "paged-kv-serve"
description = "OpenAI-compatible inference server over paged-kv-model, with Prometheus metrics."
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
cuda = ["paged-kv-model/cuda", "dep:paged-kv-cuda"]

[dependencies]
paged-kv-core = { workspace = true }
paged-kv-model = { path = "../paged-kv-model" }
paged-kv-cuda = { workspace = true, optional = true }
candle-core = "0.11"
candle-nn = "0.11"
axum = "0.7"
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
minijinja = { version = "3", features = ["json", "loop_controls"] }
minijinja-contrib = { version = "3", features = ["pycompat"] }
prometheus-client = "0.25"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
