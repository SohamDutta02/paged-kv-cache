[package]
name = "paged-kv-model"
description = "Runs Qwen2 models with their K/V in paged-kv-core's block cache."
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Keeps the K/V cache on the GPU with paged-kv-cuda's kernels.
cuda = ["dep:paged-kv-cuda", "paged-kv-cuda/cuda"]

[dependencies]
paged-kv-core = { workspace = true }
paged-kv-cuda = { workspace = true, optional = true }
candle-core = "0.11"
candle-nn = "0.11"
candle-transformers = "0.11"
serde_json = "1"

[dev-dependencies]
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"] }
