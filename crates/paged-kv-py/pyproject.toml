[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "paged-kv"
description = "Paged KV cache scheduling and Qwen2 inference, from Rust."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dynamic = ["version"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Repository = "https://github.com/SohamDutta02/paged-kv-cache"

[project.optional-dependencies]
test = ["pytest", "numpy", "safetensors", "torch", "transformers"]

[tool.maturin]
features = ["extension-module"]
