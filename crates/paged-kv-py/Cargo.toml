[package]
name = "paged-kv-py"
description = "Python bindings for paged-kv-cache: the scheduler and the Qwen2 engine."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "paged_kv"
crate-type = ["cdylib"]
# Tested from Python; a Rust test harness would need to link libpython.
test = false
doctest = false

[features]
# maturin turns this on; without it, cargo links libpython for `cargo check`.
extension-module = ["pyo3/extension-module"]
cuda = ["paged-kv-model/cuda", "dep:paged-kv-cuda"]

[dependencies]
paged-kv-core = { workspace = true }
paged-kv-model = { path = "../paged-kv-model" }
paged-kv-cuda = { workspace = true, optional = true }
candle-core = "0.11"
candle-nn = "0.11"
serde_json = "1"
pyo3 = { version = "0.29", features = ["abi3-py39"] }
